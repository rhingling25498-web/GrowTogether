name: Build Grow Together APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Build Tools
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "Error: sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$SDKMANAGER_DIR:$ANDROID_HOME/platform-tools:$PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Extract Uploaded Zip & Locate Project
        run: |
          set -e
          mkdir -p _extracted_src

          # Find any uploaded .zip file in repo (excluding hidden/node_modules/_extracted_src)
          ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" -not -path "./_extracted_src/*" -not -path "*/node_modules/*" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE"
            unzip -q -o "$ZIP_FILE" -d _extracted_src
            SEARCH_ROOT="_extracted_src"
          else
            echo "No zip file found; searching directly in repository."
            SEARCH_ROOT="."
          fi

          # Locate package.json inside extracted zip or repo
          PKG_JSON=$(find "$SEARCH_ROOT" -maxdepth 4 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_JSON" ]; then
            echo "Error: package.json not found!"
            find "$SEARCH_ROOT" -maxdepth 3
            exit 1
          fi

          PROJECT_DIR=$(cd "$(dirname "$PKG_JSON")" && pwd)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project directory: $PROJECT_DIR"

      - name: Install Dependencies & Sync Capacitor Android
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm install
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          set -e
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grow-Together-Debug-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
